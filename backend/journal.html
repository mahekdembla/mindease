<!DOCTYPE html>
<html>
<head>
    <title>MindEase Journal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
            background: #f5f5f5;
        }

        .sidebar {
            width: 220px;
            background: #f0e9f6;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            color: purple;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: purple;
            color: white;
            border: none;
            border-radius: 10px;
        }

        .entry {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .time {
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>💜 MindEase</h2>
    <p>Journal</p>
</div>

<div class="main">
    <h1>Journal</h1>
    <p>A safe space for your thoughts</p>

    <h3>New Entry</h3>

    <textarea id="entry" placeholder="What's on your mind?"></textarea>
    <br>
    <button onclick="saveEntry()">Save Entry</button>

    <h3>Previous Entries</h3>

    <div id="entries"></div>
</div>

<script>
async function saveEntry() {
    let text = document.getElementById("entry").value;

    if (!text.trim()) return;

    await fetch("http://127.0.0.1:8000/journal", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: text})
    });

    document.getElementById("entry").value = "";

    loadEntries();
}

async function loadEntries() {
    let res = await fetch("http://127.0.0.1:8000/journal");
    let data = await res.json();

    let container = document.getElementById("entries");
    container.innerHTML = "";

    data.reverse().forEach(e => {
        container.innerHTML += `
            <div class="entry">
                <div class="time">${e.time}</div>
                <div>${e.text}</div>
            </div>
        `;
    });
}

// Load on start
loadEntries();
</script>

</body>
</html>
